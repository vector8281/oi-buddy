name: Build CRM final

on:
  push:
    branches:
      - feat/crm-etapa1
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Build production
        run: bun run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: crm-production-build
          path: |
            .output/**
            dist/**
          if-no-files-found: error
          retention-days: 14
